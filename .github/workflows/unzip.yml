name: Unzip project
on:
  push:
    paths: ["singular-point.zip"]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f singular-point.zip ]; then
            unzip -oq singular-point.zip
            rm singular-point.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Unpack project"
            git push
          fi
